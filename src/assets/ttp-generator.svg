<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="750" fill="#0a0a0a"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1c1c1c" stroke-width="1">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V750M300 0V750M450 0V750M600 0V750M750 0V750M900 0V750M1050 0V750"/>
  </g>

  <!-- crosshair emblem + wordmark -->
  <g transform="translate(404 92)">
    <circle cx="40" cy="40" r="33" fill="none" stroke="url(#amber)" stroke-width="6"/>
    <circle cx="40" cy="40" r="13" fill="url(#amber)"/>
    <g stroke="url(#amber)" stroke-width="6" stroke-linecap="round">
      <path d="M40 2 V24"/>
      <path d="M40 56 V78"/>
      <path d="M2 40 H24"/>
      <path d="M56 40 H78"/>
    </g>
    <text x="100" y="40" font-size="44" font-weight="700" letter-spacing="3" fill="#fafafa">TTP</text>
    <text x="100" y="78" font-size="26" font-weight="600" letter-spacing="6" fill="#f59e0b">GENERATOR</text>
  </g>

  <!-- terminal window -->
  <g transform="translate(200 210)">
    <rect width="800" height="320" rx="18" fill="#141414" stroke="#262626" stroke-width="1.5"/>
    <!-- title bar -->
    <path d="M0 18 a18 18 0 0 1 18 -18 H782 a18 18 0 0 1 18 18 V58 H0 Z" fill="#1b1b1b"/>
    <circle cx="32" cy="29" r="7" fill="#3f3f46"/>
    <circle cx="58" cy="29" r="7" fill="#3f3f46"/>
    <circle cx="84" cy="29" r="7" fill="#3f3f46"/>
    <text x="400" y="34" text-anchor="middle" font-size="16" fill="#71717a">ttp-generator — pipeline</text>
    <!-- body -->
    <text x="40" y="118" font-size="22" fill="#a3a3a3">$ <tspan fill="#fafafa">ttp-gen</tspan> T1055 <tspan fill="#71717a">(Process Injection)</tspan></text>
    <text x="40" y="162" font-size="20" fill="#71717a">→ retrieve  <tspan fill="#a3a3a3">qdrant · 700 docs · rank-aware</tspan></text>
    <text x="40" y="202" font-size="20" fill="#71717a">→ generate  <tspan fill="#a3a3a3">claude → C → compile</tspan> <tspan fill="#22c55e">✓</tspan></text>
    <text x="40" y="242" font-size="20" fill="#71717a">→ verify    <tspan fill="#a3a3a3">ghidra IAT →</tspan> <tspan fill="#f59e0b">VirtualAllocEx</tspan></text>
    <text x="40" y="290" font-size="22" fill="#22c55e">✓ <tspan fill="url(#amber)" font-weight="700">opsec 0.17</tspan><tspan fill="#71717a"> — artifact + detection report</tspan><tspan fill="#f59e0b">▋</tspan></text>
  </g>

  <!-- pipeline stage chips -->
  <g transform="translate(0 600)" font-size="18" fill="#a3a3a3" text-anchor="middle">
    <rect x="235" y="0" width="124" height="40" rx="20" fill="#171717" stroke="#262626"/>
    <text x="297" y="26">retrieve</text>
    <rect x="371" y="0" width="126" height="40" rx="20" fill="#171717" stroke="#262626"/>
    <text x="434" y="26">generate</text>
    <rect x="509" y="0" width="116" height="40" rx="20" fill="#171717" stroke="#262626"/>
    <text x="567" y="26">compile</text>
    <rect x="637" y="0" width="100" height="40" rx="20" fill="#171717" stroke="#262626"/>
    <text x="687" y="26">verify</text>
    <rect x="749" y="0" width="112" height="40" rx="20" fill="#171717" stroke="#262626"/>
    <text x="805" y="26">execute</text>
    <rect x="873" y="0" width="92" height="40" rx="20" fill="#171717" stroke="#262626"/>
    <text x="919" y="26">score</text>
  </g>
</svg>
