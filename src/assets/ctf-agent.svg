<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="750" fill="#0a0a0a"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1c1c1c" stroke-width="1">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V750M300 0V750M450 0V750M600 0V750M750 0V750M900 0V750M1050 0V750"/>
  </g>

  <!-- flag emblem + wordmark -->
  <g transform="translate(430 96)">
    <rect x="0" y="6" width="6" height="74" rx="3" fill="#3f3f46"/>
    <path d="M6 10 H92 L74 32 L92 54 H6 Z" fill="url(#amber)"/>
    <text x="118" y="40" font-size="44" font-weight="700" letter-spacing="3" fill="#fafafa">CTF</text>
    <text x="118" y="78" font-size="26" font-weight="600" letter-spacing="8" fill="#f59e0b">AGENT</text>
  </g>

  <!-- terminal window -->
  <g transform="translate(200 210)">
    <rect width="800" height="320" rx="18" fill="#141414" stroke="#262626" stroke-width="1.5"/>
    <!-- title bar -->
    <path d="M0 18 a18 18 0 0 1 18 -18 H782 a18 18 0 0 1 18 18 V58 H0 Z" fill="#1b1b1b"/>
    <circle cx="32" cy="29" r="7" fill="#3f3f46"/>
    <circle cx="58" cy="29" r="7" fill="#3f3f46"/>
    <circle cx="84" cy="29" r="7" fill="#3f3f46"/>
    <text x="400" y="34" text-anchor="middle" font-size="16" fill="#71717a">ctf-jeopardy — router</text>
    <!-- body -->
    <text x="40" y="118" font-size="22" fill="#a3a3a3">$ <tspan fill="#fafafa">/ctf</tspan> the-kraken-awakens.md</text>
    <text x="40" y="162" font-size="20" fill="#71717a">→ triage   flag: <tspan fill="#a3a3a3">CDDC2026{...}</tspan>   category: <tspan fill="#f59e0b">crypto</tspan></text>
    <text x="40" y="202" font-size="20" fill="#71717a">→ recon    file · strings · binwalk · exiftool</text>
    <text x="40" y="242" font-size="20" fill="#71717a">→ solve    load playbook → recover key</text>
    <text x="40" y="290" font-size="22" fill="#22c55e">✓ <tspan fill="url(#amber)" font-weight="700">CDDC2026{0xC0FFEE_KRAKEN}</tspan><tspan fill="#f59e0b">▋</tspan></text>
  </g>

  <!-- category chips -->
  <g transform="translate(0 600)" font-size="18" fill="#a3a3a3" text-anchor="middle">
    <g>
      <rect x="208" y="0" width="92" height="40" rx="20" fill="#171717" stroke="#262626"/>
      <text x="254" y="26">web</text>
      <rect x="312" y="0" width="92" height="40" rx="20" fill="#171717" stroke="#262626"/>
      <text x="358" y="26">pwn</text>
      <rect x="416" y="0" width="110" height="40" rx="20" fill="#171717" stroke="#262626"/>
      <text x="471" y="26">reverse</text>
      <rect x="538" y="0" width="104" height="40" rx="20" fill="#171717" stroke="#262626"/>
      <text x="590" y="26">crypto</text>
      <rect x="654" y="0" width="128" height="40" rx="20" fill="#171717" stroke="#262626"/>
      <text x="718" y="26">forensics</text>
      <rect x="794" y="0" width="100" height="40" rx="20" fill="#171717" stroke="#262626"/>
      <text x="844" y="26">osint</text>
      <rect x="906" y="0" width="86" height="40" rx="20" fill="#171717" stroke="#262626"/>
      <text x="949" y="26">ot</text>
    </g>
  </g>
</svg>
