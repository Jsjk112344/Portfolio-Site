<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/gissp9ieyepr/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prox Coffee — map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<link rel="stylesheet" href="styles/classical.css">
<link rel="stylesheet" href="styles/site.css">
<style>
/* Framed by the iframe on locations.html, so the document is the map. */
html, body, #map { margin: 0; height: 100%; background: var(--prox-cream); }

/* Warm the stock OSM tiles towards the Prox palette. */
.leaflet-tile-pane { filter: grayscale(1) sepia(0.35) contrast(0.92) brightness(1.04); }

.pin {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--prox-terracotta);
  border: 3px solid var(--prox-cream-deep);
  box-shadow: 0 1px 4px rgb(74 42 28 / 0.35);
}

.leaflet-popup-content-wrapper {
  background: var(--prox-paper);
  color: var(--prox-ink);
  border: 1px solid var(--prox-rule);
  border-radius: 4px;
  box-shadow: 0 2px 10px rgb(74 42 28 / 0.15);
}

.leaflet-popup-tip { background: var(--prox-paper); }

.leaflet-popup-content {
  margin: 14px 18px;
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.55;
}

.leaflet-popup-content b {
  display: block;
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 20px;
  text-transform: uppercase;
  color: var(--prox-terracotta);
  margin-bottom: 4px;
}

.leaflet-popup-content a,
.leaflet-container a.leaflet-popup-close-button,
.leaflet-control-attribution a { color: var(--prox-rust); }

.leaflet-control-attribution {
  font-family: var(--font-body);
  background: rgb(247 240 230 / 0.85) !important;
}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="scripts/map.js" defer></script>
</body>
</html>
